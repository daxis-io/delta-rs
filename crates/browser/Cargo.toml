[package]
name = "deltalake-browser"
version = "0.32.4"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Read-only Delta Lake snapshot and query support for browser WASM"
publish = false

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
datafusion = { git = "https://github.com/daxis-io/datafusion", rev = "4dae3daaccc426d98f8dbb3c234a505bde338cdf", default-features = false, features = ["parquet", "sql"] }
delta_kernel = { package = "buoyant_kernel", git = "https://github.com/daxis-io/delta-kernel-rs", rev = "6d5fd5c642c8df5475d50e6afb5cc4ca6fa0867b", default-features = false, features = ["arrow-58", "arrow-conversion", "arrow-expression", "internal-api"] }
futures.workspace = true
object_store = { git = "https://github.com/daxis-io/arrow-rs-object-store", rev = "e3a57c148f7b12159b1f41b336f21bfc1df3cfaf", default-features = false }
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
parquet = { workspace = true, features = ["arrow", "snap"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
