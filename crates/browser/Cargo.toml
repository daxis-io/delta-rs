[package]
name = "deltalake-browser"
version = "0.32.4"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Read-only Delta Lake snapshot and query support for browser WASM"
publish = false

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
datafusion = { git = "https://github.com/daxis-io/datafusion", rev = "520b3845d14362b63b22e55156447f8578cc9b99", default-features = false, features = ["parquet", "sql"] }
delta_kernel = { package = "buoyant_kernel", git = "https://github.com/daxis-io/delta-kernel-rs", rev = "79c48fe4e22431efb144da4a0db46bb8ff5ce9d8", default-features = false, features = ["arrow-58", "arrow-conversion", "arrow-expression", "internal-api"] }
futures.workspace = true
object_store = { git = "https://github.com/daxis-io/arrow-rs-object-store", rev = "54109e3e6797522ccb2ee5d43cad2a9cd0013074", default-features = false }
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
parquet = { workspace = true, features = ["arrow", "snap"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
