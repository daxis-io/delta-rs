[package]
name = "deltalake-browser"
version = "0.32.4"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Read-only Delta Lake snapshot and query support for browser WASM"
publish = false

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
datafusion = { git = "https://github.com/daxis-io/datafusion", rev = "129ed4cb351d1e2e1a3406d07893f584ce1f69f3", default-features = false, features = ["parquet", "sql"] }
delta_kernel = { package = "buoyant_kernel", git = "https://github.com/daxis-io/delta-kernel-rs", rev = "d72ae5325f86d734d7a0ab9045ba6c13c7d3cdb4", default-features = false, features = ["arrow-58", "arrow-conversion", "arrow-expression", "internal-api"] }
futures.workspace = true
object_store = { version = "0.13.2", default-features = false }
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
parquet = { workspace = true, features = ["arrow", "snap"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
