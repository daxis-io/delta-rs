[package]
name = "deltalake-browser"
version = "0.32.4"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Read-only Delta Lake snapshot and query support for browser WASM"
publish = false

[dependencies]
arrow-array.workspace = true
arrow-ipc.workspace = true
arrow-schema.workspace = true
async-trait.workspace = true
bytes.workspace = true
datafusion = { git = "https://github.com/daxis-io/datafusion", rev = "aa1d3bfb591e0e10594160119d8899d4b856c3f5", default-features = false, features = ["parquet", "sql"] }
delta_kernel = { package = "buoyant_kernel", git = "https://github.com/daxis-io/delta-kernel-rs", rev = "bbccfb394bf4a3eac54e125d71996a66a5a0e13a", default-features = false, features = ["arrow-58", "arrow-conversion", "arrow-expression", "daxis-browser-stack", "internal-api"] }
futures.workspace = true
object_store = { git = "https://github.com/daxis-io/arrow-rs-object-store", rev = "a04240eafdc5833e34fe21d4b348ee399177def6", default-features = false }
thiserror.workspace = true
url.workspace = true

[dev-dependencies]
parquet = { workspace = true, features = ["arrow", "snap"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
