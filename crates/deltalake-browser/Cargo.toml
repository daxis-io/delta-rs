[package]
name = "deltalake-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
license.workspace = true
repository.workspace = true
description = "Opt-in finite JSON Delta snapshot adapter for caller-owned DataFusion sessions"

[features]
default = []
qualification-fixture = ["datafusion_executor/qualification-fixture"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
datafusion = { version = "55", default-features = false, features = ["nested_expressions"] }
datafusion-datasource = { version = "55", default-features = false }
datafusion-datasource-parquet = { version = "55", default-features = false, features = ["parquet-read"] }
datafusion_executor = { version = "0.26.0", default-features = false }
delta_kernel = { version = "0.28.0", default-features = false, features = ["arrow-only", "arrow-expression", "operation-tasks", "declarative-plans", "vendored-protoc"] }
futures = "0.3"
object_store = { version = "0.14.1", default-features = false }
url = "2"

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
datafusion = { version = "55", default-features = false, features = ["runtime-tokio", "parquet", "json"] }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
datafusion = { version = "55", default-features = false, features = ["browser"] }
datafusion-datasource-parquet = { version = "55", default-features = false, features = ["runtime-browser"] }

[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
delta_kernel_default_engine = { version = "0.28.0", default-features = false, features = ["arrow-59"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
